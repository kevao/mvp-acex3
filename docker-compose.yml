version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: marmitas-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - marmitas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: marmitas-adminer
    restart: always
    ports:
      - "8084:8080"
    depends_on:
      - postgres
    networks:
      - marmitas-network

volumes:
  postgres_data:
  redis_data:
  media_uploads:

networks:
  marmitas-network:
    driver: bridge
